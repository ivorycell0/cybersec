<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cybersec | Admin Panel</title>
    <link rel="stylesheet" href="style.css">
    <script>if(!localStorage.getItem('cybersec-token')){location.href='login.html';}</script>
    <style>
        .admin-tabs { display:flex;gap:0.5rem;margin-bottom:2rem;flex-wrap:wrap;justify-content:center; }
        .admin-tab { background:none;border:1px solid var(--glass-border);color:var(--text-muted);padding:0.5rem 1.2rem;font-size:0.7rem;letter-spacing:1.5px;cursor:pointer;transition:0.2s;border-radius:8px;text-transform:uppercase; }
        .admin-tab:hover { border-color:var(--red);color:var(--text); }
        .admin-tab.active { background:rgba(255,0,64,0.1);border-color:var(--red);color:var(--red); }
        .admin-section { display:none;width:100%;max-width:900px;animation:modalIn 0.2s ease; }
        .admin-section.open { display:block; }
        .admin-table { width:100%;border-collapse:collapse;font-size:0.8rem; }
        .admin-table th { text-align:left;padding:0.6rem 0.8rem;border-bottom:1px solid var(--glass-border);font-size:0.65rem;letter-spacing:1.5px;color:var(--text-dim);font-weight:400; }
        .admin-table td { padding:0.6rem 0.8rem;border-bottom:1px solid rgba(255,255,255,0.03);color:var(--text-muted); }
        .admin-table tr:hover td { background:rgba(255,255,255,0.03); }
        .admin-role-select { background:var(--input-bg);border:1px solid var(--glass-border);color:var(--text);padding:0.2rem 0.4rem;font-size:0.7rem;border-radius:6px;outline:none;cursor:pointer; }
        .admin-role-select:focus { border-color:var(--red); }
        .admin-tag-preview { font-size:0.65rem;padding:2px 8px;border:1px solid;border-radius:8px;display:inline-block;font-weight:600;letter-spacing:1px; }
        .admin-empty { color:var(--text-dim);font-style:italic;font-size:0.85rem;text-align:center;padding:2rem; }
        .admin-action-btn { background:none;border:1px solid var(--glass-border);color:var(--text-muted);padding:0.2rem 0.6rem;font-size:0.6rem;cursor:pointer;transition:0.2s;border-radius:4px;letter-spacing:1px; }
        .admin-action-btn:hover { border-color:var(--red);color:var(--red); }
        .admin-action-btn.danger:hover { border-color:var(--magenta);color:var(--magenta); }
        .admin-action-btn.success:hover { border-color:var(--cyan);color:var(--cyan); }
        .admin-inline { display:flex;align-items:center;gap:0.5rem;flex-wrap:wrap; }
        .admin-dash-grid { display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:0.8rem;margin-bottom:2rem; }
        .admin-stat-card { background:var(--glass);border:1px solid var(--glass-border);padding:1rem;border-radius:14px;text-align:center; }
        .admin-stat-num { font-size:1.5rem;font-weight:700;color:var(--text);margin-bottom:0.2rem; }
        .admin-stat-label { font-size:0.6rem;letter-spacing:1.5px;color:var(--text-dim);text-transform:uppercase; }
        .admin-color-input { width:30px;height:26px;border:1px solid var(--glass-border);background:transparent;cursor:pointer;padding:1px;border-radius:4px;vertical-align:middle; }
        .admin-search { background:var(--input-bg);border:1px solid var(--glass-border);color:var(--text);padding:0.5rem 0.8rem;font-size:0.8rem;border-radius:8px;outline:none;width:100%;max-width:300px;transition:0.2s; }
        .admin-search:focus { border-color:var(--red); }
    </style>
</head>
<body>
    <canvas id="snowfall"></canvas>

    <nav>
        <div class="logo">CYBERSEC</div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="services.html">Services</a></li>
            <li><a href="sandbox.html">Sandbox</a></li>
            <li><a href="blog.html">Blog</a></li>
            <li><a href="tickets.html">Tickets</a></li>
            <li><a href="login.html">Login</a></li>
        </ul>
        <div class="hamburger" onclick="toggleNav()">&#9776;</div>
    </nav>

    <main>
        <section class="page-content">
            <h1>ADMIN PANEL</h1>

            <div id="dash-denied" class="chat-login-msg" style="display:none">Access denied. <strong>Owner</strong> and <strong>Co-Owner</strong> only.</div>

            <div id="dash-content">
                <div class="admin-tabs" id="admin-tabs"></div>
                <div id="admin-sections"></div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
    <script src="api.js"></script>
    <script>
        var ROLE_ORDER = ['owner','co-owner','dev','admin','mod','regular'];
        var ROLE_COLORS = { owner:'#ff0040','co-owner':'#ff00aa',dev:'#8800ff',admin:'#00e5ff',mod:'#00cc88',regular:'#8888aa' };
        var ROLE_LABEL = { owner:'\u265B Owner','co-owner':'\u265B Co-Owner',dev:'Dev',admin:'Admin',mod:'Mod',regular:'' };
        var STAFF_ROLES = ['owner','co-owner','dev','admin'];

        var _cachedUsers = [];
        var _cachedTickets = [];

        function loadUsers() {
            return apiGetUsers().then(function(users) {
                _cachedUsers = users;
                users.forEach(function(u) { if (!u.role) u.role = 'regular'; });
                var cs = users.find(function(u) { return u.username.toLowerCase() === 'cs'; });
                if (cs) cs.role = 'owner';
                return users;
            }).catch(function() { return []; });
        }

        function loadTickets() {
            return apiGetTickets().then(function(t) { _cachedTickets = t; return t; }).catch(function() { return []; });
        }

        function saveUser(username, data) {
            return apiUpdateUser(username, data).then(function() { return loadUsers(); });
        }

        function getSession() { return localStorage.getItem('cybersec-session'); }

        function currentUser() {
            var s = getSession();
            if (!s) return null;
            return _cachedUsers.find(function(u) { return u.username.toLowerCase() === s.toLowerCase(); });
        }

        function canAccess() {
            var u = currentUser();
            if (!u) return false;
            return u.role === 'owner' || u.role === 'co-owner';
        }

        function formatDate(iso) {
            var d = new Date(iso);
            return d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
        }

        function getTagStyleClass(u) {
            var s = u.tagStyle || 'glossy';
            return 'tag-' + (s === 'rainbow' ? 'rainbow' : s);
        }

        function getTagColor(u) {
            if (u.tagStyle === 'rainbow') return ROLE_COLORS[u.role] || '#8888aa';
            return u.tagColor || ROLE_COLORS[u.role] || '#8888aa';
        }

        function getDisplayTag(u) {
            if (u.customTag && u.customTag.trim()) return u.customTag.trim();
            return ROLE_LABEL[u.role] || '';
        }

        var TABS = [
            { id:'overview', label:'Overview' },
            { id:'users', label:'Users & Roles' },
            { id:'tickets', label:'Tickets' },
            { id:'tags', label:'Tag Management' },
            { id:'system', label:'System' },
        ];
        var activeTab = 'overview';

        function switchTab(id) {
            activeTab = id;
            document.querySelectorAll('.admin-tab').forEach(function(t) { t.classList.remove('active'); });
            document.querySelectorAll('.admin-section').forEach(function(s) { s.classList.remove('open'); });
            var tab = document.querySelector('.admin-tab[data-tab="' + id + '"]');
            if (tab) tab.classList.add('active');
            var sec = document.getElementById('section-' + id);
            if (sec) sec.classList.add('open');
            if (id === 'users') renderUsersSection();
            if (id === 'tickets') renderTicketsSection();
            if (id === 'tags') renderTagsSection();
            if (id === 'overview') renderOverview();
        }

        function renderTabs() {
            var html = '';
            TABS.forEach(function(t) {
                html += '<button class="admin-tab' + (t.id === activeTab ? ' active' : '') + '" data-tab="' + t.id + '" onclick="switchTab(\'' + t.id + '\')">' + t.label + '</button>';
            });
            document.getElementById('admin-tabs').innerHTML = html;
        }

        function initSections() {
            var html = '';
            TABS.forEach(function(t) {
                html += '<div class="admin-section' + (t.id === activeTab ? ' open' : '') + '" id="section-' + t.id + '"></div>';
            });
            document.getElementById('admin-sections').innerHTML = html;
        }

        function renderOverview() {
            var users = _cachedUsers;
            var tickets = _cachedTickets;
            var openTickets = tickets.filter(function(t) { return t.status === 'open'; });
            var staff = users.filter(function(u) { return STAFF_ROLES.indexOf(u.role) !== -1; });
            apiGetChat().then(function(chats) {
                var html = '<div class="admin-dash-grid">';
                html += '<div class="admin-stat-card"><div class="admin-stat-num">' + users.length + '</div><div class="admin-stat-label">Total Users</div></div>';
                html += '<div class="admin-stat-card"><div class="admin-stat-num">' + staff.length + '</div><div class="admin-stat-label">Staff Members</div></div>';
                html += '<div class="admin-stat-card"><div class="admin-stat-num">' + tickets.length + '</div><div class="admin-stat-label">Total Tickets</div></div>';
                html += '<div class="admin-stat-card"><div class="admin-stat-num" style="color:var(--red);">' + openTickets.length + '</div><div class="admin-stat-label">Open Tickets</div></div>';
                html += '<div class="admin-stat-card"><div class="admin-stat-num">' + chats.length + '</div><div class="admin-stat-label">Chat Messages</div></div>';
                html += '</div>';

                html += '<div class="dash-terminal" style="margin-top:2rem;">';
                html += '<div class="dash-term-header">ADMIN TERMINAL <span class="term-blink">&#9608;</span></div>';
                html += '<div class="dash-term-body" id="term-body" style="min-height:140px;max-height:200px;"></div></div>';

                document.getElementById('section-overview').innerHTML = html;

                var termBody = document.getElementById('term-body');
                var termLines = [
                    'system initialized',
                    'user database loaded (' + users.length + ' records)',
                    'STAFF: ' + staff.map(function(u) { return u.username; }).join(', '),
                    'open tickets: ' + openTickets.length + ' / ' + tickets.length,
                    'all systems nominal',
                ];
                termLines.forEach(function(line) {
                    var el = document.createElement('div');
                    el.className = 'term-line';
                    el.innerHTML = '<span class="term-prompt">admin@cybersec:~$</span> ' + line;
                    termBody.appendChild(el);
                });
                termBody.scrollTop = termBody.scrollHeight;
            });
        }

        function renderUsersSection() {
            var users = _cachedUsers;
            var session = getSession();
            var html = '';

            html += '<div style="display:flex;gap:0.8rem;margin-bottom:1.5rem;flex-wrap:wrap;align-items:center;">';
            html += '<input class="admin-search" id="user-search" placeholder="Search users..." oninput="renderUsersSection()">';
            html += '<button class="admin-action-btn success" onclick="addUser()">+ Add User</button>';
            html += '</div>';

            var search = document.getElementById('user-search');
            var q = search ? search.value.toLowerCase().trim() : '';
            var filtered = q ? users.filter(function(u) { return u.username.toLowerCase().indexOf(q) !== -1; }) : users;
            filtered.sort(function(a, b) { return ROLE_ORDER.indexOf(a.role) - ROLE_ORDER.indexOf(b.role); });

            if (filtered.length === 0) {
                html += '<div class="admin-empty">No users' + (q ? ' matching "' + q + '"' : '') + '.</div>';
                document.getElementById('section-users').innerHTML = html;
                return;
            }

            html += '<div style="overflow-x:auto;"><table class="admin-table">';
            html += '<thead><tr><th>#</th><th>Username</th><th>Role</th><th>Tag</th><th>Actions</th></tr></thead><tbody>';
            filtered.forEach(function(u, i) {
                var isYou = session && session.toLowerCase() === u.username.toLowerCase();
                var tagColor = getTagColor(u);
                var styleClass = getTagStyleClass(u);
                var roleOptions = ROLE_ORDER.map(function(r) {
                    return '<option value="' + r + '"' + (r === u.role ? ' selected' : '') + '>' + ROLE_LABEL[r] + '</option>';
                }).join('');

                html += '<tr>';
                html += '<td>' + (i + 1) + '</td>';
                html += '<td>' + u.username + (isYou ? ' <span style="color:var(--cyan);font-size:0.6rem;">(you)</span>' : '') + '</td>';
                html += '<td><select class="admin-role-select" onchange="changeRole(\'' + u.username + '\',this.value)">' + roleOptions + '</select></td>';
                html += '<td><span class="admin-tag-preview ' + styleClass + '" style="color:' + tagColor + ';border-color:' + tagColor + ';">' + (getDisplayTag(u) || u.role.toUpperCase()) + '</span></td>';
                html += '<td><div class="admin-inline">';
                html += '<button class="admin-action-btn success" onclick="editTag(\'' + u.username + '\')">Tag</button>';
                if (!isYou) html += '<button class="admin-action-btn danger" onclick="deleteUser(\'' + u.username + '\')">Delete</button>';
                html += '</div></td>';
                html += '</tr>';
            });
            html += '</tbody></table></div>';
            document.getElementById('section-users').innerHTML = html;
        }

        function changeRole(username, newRole) {
            var u = _cachedUsers.find(function(x) { return x.username.toLowerCase() === username.toLowerCase(); });
            if (!u) return;
            if (u.role === 'owner') return;
            saveUser(username, { role: newRole }).then(function() {
                renderUsersSection();
                if (activeTab === 'overview') renderOverview();
            });
        }

        function deleteUser(username) {
            var overlay = document.createElement('div');
            overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:200;display:flex;align-items:center;justify-content:center;animation:modalIn 0.2s ease;';
            overlay.innerHTML = '<div style="background:var(--glass);border:1px solid var(--glass-border);padding:2rem;border-radius:16px;max-width:380px;width:90%;text-align:center;backdrop-filter:blur(20px);"><div style="font-size:1rem;margin-bottom:0.5rem;color:var(--text);">Delete "' + username + '"?</div><div style="font-size:0.75rem;color:var(--text-dim);margin-bottom:1.5rem;">This cannot be undone.</div><div style="display:flex;gap:0.8rem;justify-content:center;"><button class="btn-neon" id="adm-confirm-del" style="border-color:var(--magenta);color:var(--magenta);padding:0.4rem 1.2rem;font-size:0.75rem;">Delete</button><button class="btn-neon" id="adm-cancel-del" style="padding:0.4rem 1.2rem;font-size:0.75rem;">Cancel</button></div></div>';
            document.body.appendChild(overlay);
            document.getElementById('adm-confirm-del').addEventListener('click', function() {
                apiDeleteUser(username).then(function() {
                    return loadUsers();
                }).then(function() {
                    document.body.removeChild(overlay);
                    renderUsersSection();
                    if (activeTab === 'overview') renderOverview();
                });
            });
            document.getElementById('adm-cancel-del').addEventListener('click', function() { document.body.removeChild(overlay); });
            overlay.addEventListener('click', function(e) { if (e.target === overlay) document.body.removeChild(overlay); });
        }

        function addUser() {
            var overlay = document.createElement('div');
            overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:200;display:flex;align-items:center;justify-content:center;animation:modalIn 0.2s ease;';
            overlay.innerHTML = '<div style="background:var(--glass);border:1px solid var(--glass-border);padding:2rem;border-radius:16px;max-width:380px;width:90%;text-align:center;backdrop-filter:blur(20px);"><div style="font-size:1rem;margin-bottom:1rem;color:var(--text);">Add User</div><input id="adm-new-user" placeholder="Username" style="width:100%;background:var(--input-bg);border:1px solid var(--glass-border);padding:0.6rem 0.8rem;color:var(--text);font-size:0.85rem;border-radius:8px;outline:none;margin-bottom:0.6rem;"><input id="adm-new-pass" type="password" placeholder="Password" style="width:100%;background:var(--input-bg);border:1px solid var(--glass-border);padding:0.6rem 0.8rem;color:var(--text);font-size:0.85rem;border-radius:8px;outline:none;margin-bottom:0.6rem;"><select id="adm-new-role" style="width:100%;background:var(--input-bg);border:1px solid var(--glass-border);padding:0.6rem 0.8rem;color:var(--text);font-size:0.85rem;border-radius:8px;outline:none;margin-bottom:1rem;">' + ROLE_ORDER.map(function(r) { return '<option value="' + r + '">' + ROLE_LABEL[r] + '</option>'; }).join('') + '</select><div style="display:flex;gap:0.8rem;justify-content:center;"><button class="btn-neon" id="adm-confirm-add" style="padding:0.4rem 1.2rem;font-size:0.75rem;">Create</button><button class="btn-neon" id="adm-cancel-add" style="padding:0.4rem 1.2rem;font-size:0.75rem;">Cancel</button></div><p id="adm-add-err" style="color:var(--red);font-size:0.7rem;margin-top:0.5rem;"></p></div>';
            document.body.appendChild(overlay);
            document.getElementById('adm-confirm-add').addEventListener('click', function() {
                var user = document.getElementById('adm-new-user').value.trim();
                var pass = document.getElementById('adm-new-pass').value.trim();
                var role = document.getElementById('adm-new-role').value;
                var err = document.getElementById('adm-add-err');
                if (!user || !pass) { err.textContent = 'Username and password required.'; return; }
                apiSignup(user, pass).then(function() {
                    return apiUpdateUser(user, { role: role });
                }).then(function() {
                    return loadUsers();
                }).then(function() {
                    document.body.removeChild(overlay);
                    renderUsersSection();
                    if (activeTab === 'overview') renderOverview();
                }).catch(function(e) {
                    err.textContent = e.message || 'Error creating user';
                });
            });
            document.getElementById('adm-cancel-add').addEventListener('click', function() { document.body.removeChild(overlay); });
            overlay.addEventListener('click', function(e) { if (e.target === overlay) document.body.removeChild(overlay); });
        }

        function renderTicketsSection() {
            var tickets = _cachedTickets;
            var html = '';

            html += '<div style="display:flex;gap:0.5rem;margin-bottom:1rem;flex-wrap:wrap;justify-content:center;">';
            html += '<button class="tag-style-btn tag-style-active" id="tfl-all" onclick="filterTickets(\'all\')">All</button>';
            html += '<button class="tag-style-btn" id="tfl-open" onclick="filterTickets(\'open\')">Open</button>';
            html += '<button class="tag-style-btn" id="tfl-closed" onclick="filterTickets(\'closed\')">Closed</button>';
            html += '</div>';

            var filter = ticketFilter || 'all';
            var filtered = tickets;
            if (filter === 'open') filtered = tickets.filter(function(t) { return t.status === 'open'; });
            if (filter === 'closed') filtered = tickets.filter(function(t) { return t.status === 'closed'; });

            if (filtered.length === 0) {
                html += '<div class="admin-empty">No tickets yet.</div>';
                document.getElementById('section-tickets').innerHTML = html;
                return;
            }

            html += '<div style="overflow-x:auto;"><table class="admin-table">';
            html += '<thead><tr><th>Subject</th><th>Author</th><th>Priority</th><th>Status</th><th>Date</th><th>Actions</th></tr></thead><tbody>';
            filtered.forEach(function(t) {
                var pColor = { low:'#55ff55', medium:'#ffaa00', high:'#ff0040' }[t.priority] || '#8888aa';
                var statusColor = t.status === 'open' ? 'var(--red)' : 'var(--text-dim)';
                var htmlRow = '<tr>';
                htmlRow += '<td style="color:var(--text);font-weight:500;">' + t.subject + '</td>';
                htmlRow += '<td>' + t.author + '</td>';
                htmlRow += '<td><span style="font-size:0.55rem;letter-spacing:1px;padding:2px 8px;border:1px solid ' + pColor + ';color:' + pColor + ';border-radius:8px;text-transform:uppercase;font-weight:600;">' + (t.priority || 'low') + '</span></td>';
                htmlRow += '<td style="color:' + statusColor + ';font-weight:600;text-transform:uppercase;font-size:0.65rem;">' + t.status + '</td>';
                htmlRow += '<td style="font-size:0.65rem;color:var(--text-dim);">' + formatDate(t.date) + '</td>';
                htmlRow += '<td><div class="admin-inline">';
                if (t.status === 'open') htmlRow += '<button class="admin-action-btn success" onclick="adminCloseTicket(' + t.id + ')">Close</button>';
                else htmlRow += '<button class="admin-action-btn" onclick="adminReopenTicket(' + t.id + ')">Reopen</button>';
                htmlRow += '<button class="admin-action-btn danger" onclick="adminDeleteTicket(' + t.id + ')">Delete</button>';
                htmlRow += '</div></td></tr>';
                html += htmlRow;
            });
            html += '</tbody></table></div>';
            document.getElementById('section-tickets').innerHTML = html;
        }

        var ticketFilter = 'all';
        function filterTickets(f) {
            ticketFilter = f;
            document.querySelectorAll('#section-tickets .tag-style-btn').forEach(function(b) { b.classList.remove('tag-style-active'); });
            document.getElementById('tfl-' + f).classList.add('tag-style-active');
            renderTicketsSection();
        }

        function adminCloseTicket(id) {
            apiUpdateTicket(id, { status: 'closed' }).then(function() { return loadTickets(); }).then(function() { renderTicketsSection(); });
        }
        function adminReopenTicket(id) {
            apiUpdateTicket(id, { status: 'open' }).then(function() { return loadTickets(); }).then(function() { renderTicketsSection(); });
        }
        function adminDeleteTicket(id) {
            if (!confirm('Delete this ticket permanently?')) return;
            apiDeleteTicket(id).then(function() { return loadTickets(); }).then(function() { renderTicketsSection(); });
        }

        function renderTagsSection() {
            var users = _cachedUsers;
            var session = getSession();
            var html = '';

            html += '<div style="margin-bottom:1rem;font-size:0.8rem;color:var(--text-muted);">Manage tag styles, colors, and custom text for staff members.</div>';

            var staff = users.filter(function(u) { return STAFF_ROLES.indexOf(u.role) !== -1; });
            if (staff.length === 0) {
                html += '<div class="admin-empty">No staff members.</div>';
                document.getElementById('section-tags').innerHTML = html;
                return;
            }

            html += '<div style="overflow-x:auto;"><table class="admin-table">';
            html += '<thead><tr><th>Username</th><th>Role</th><th>Style</th><th>Color</th><th>Preview</th></tr></thead><tbody>';
            staff.forEach(function(u) {
                var isYou = session && session.toLowerCase() === u.username.toLowerCase();
                var style = u.tagStyle || 'glossy';
                var color = getTagColor(u);
                var styleClass = getTagStyleClass(u);
                var styles = ['glossy','neon','glitter','sparkle','rainbow'];
                var styleOpts = styles.map(function(s) { return '<option value="' + s + '"' + (s === style ? ' selected' : '') + '>' + s.charAt(0).toUpperCase() + s.slice(1) + '</option>'; }).join('');

                var displayTag = getDisplayTag(u);
                var customTagVal = (u.customTag || '');

                html += '<tr>';
                html += '<td>' + u.username + (isYou ? ' <span style="color:var(--cyan);font-size:0.6rem;">(you)</span>' : '') + '</td>';
                html += '<td><span class="admin-tag-preview" style="color:' + (ROLE_COLORS[u.role]||'#8888aa') + ';border-color:' + (ROLE_COLORS[u.role]||'#8888aa') + ';">' + (ROLE_LABEL[u.role] || u.role.toUpperCase()) + '</span></td>';
                html += '<td><select class="admin-role-select" onchange="updateTagStyle(\'' + u.username + '\',this.value)">' + styleOpts + '</select></td>';
                html += '<td><input type="color" class="admin-color-input" value="' + (u.tagColor || ROLE_COLORS[u.role] || '#8888aa') + '" onchange="updateTagColor(\'' + u.username + '\',this.value)"></td>';
                html += '<td style="font-size:0.65rem;">';
                html += '<input type="text" value="' + customTagVal.replace(/"/g,'&quot;') + '" placeholder="Custom tag" style="width:90px;background:var(--input-bg);border:1px solid var(--glass-border);padding:0.15rem 0.4rem;color:var(--text);font-size:0.6rem;outline:none;border-radius:4px;margin-right:4px;" onchange="updateCustomTag(\'' + u.username + '\',this.value)">';
                html += '<span class="admin-tag-preview ' + styleClass + '" id="tag-prev-' + u.username + '" style="color:' + color + ';border-color:' + color + ';">' + (displayTag || u.role.toUpperCase()) + '</span>';
                html += '</td>';
                html += '</tr>';
            });
            html += '</tbody></table></div>';
            document.getElementById('section-tags').innerHTML = html;
        }

        function updateTagStyle(username, style) {
            saveUser(username, { tagStyle: style }).then(function() { renderTagsSection(); });
        }

        function updateTagColor(username, color) {
            saveUser(username, { tagColor: color }).then(function() {
                var prev = document.getElementById('tag-prev-' + username);
                if (prev) { prev.style.color = color; prev.style.borderColor = color; }
            });
        }

        function updateCustomTag(username, val) {
            saveUser(username, { customTag: val }).then(function() {
                var prev = document.getElementById('tag-prev-' + username);
                var u = _cachedUsers.find(function(x) { return x.username.toLowerCase() === username.toLowerCase(); });
                if (prev && u) { prev.textContent = getDisplayTag(u) || u.role.toUpperCase(); }
            });
        }

        function editTag(username) {
            var u = _cachedUsers.find(function(x) { return x.username.toLowerCase() === username.toLowerCase(); });
            if (!u) return;
            var style = u.tagStyle || 'glossy';
            var color = getTagColor(u);
            var active = u.role === 'owner' || u.role === 'co-owner';
            if (!active) { switchTab('tags'); return; }

            var overlay = document.createElement('div');
            overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:200;display:flex;align-items:center;justify-content:center;animation:modalIn 0.2s ease;';
            var styles = ['glossy','neon','glitter','sparkle','rainbow'];
            var styleBtns = styles.map(function(s) {
                return '<button class="tag-style-btn' + (s === style ? ' tag-style-active' : '') + '" data-s="' + s + '" style="margin:2px;">' + s.charAt(0).toUpperCase() + s.slice(1) + '</button>';
            }).join('');

            var customTagVal = (u.customTag || '');
            var displayTag = getDisplayTag(u);
            overlay.innerHTML = '<div style="background:var(--glass);border:1px solid var(--glass-border);padding:2rem;border-radius:16px;max-width:420px;width:90%;text-align:center;backdrop-filter:blur(20px);"><div style="font-size:1rem;margin-bottom:1rem;color:var(--text);">Tag Settings &mdash; ' + u.username + '</div><div style="margin-bottom:1rem;">' + styleBtns + '</div><div id="et-color-row"' + (style === 'rainbow' ? ' style="display:none"' : '') + '><label style="font-size:0.8rem;color:var(--text-muted);cursor:pointer;"><input type="color" id="et-color" value="' + (u.tagColor || ROLE_COLORS[u.role] || '#8888aa') + '" style="width:40px;height:28px;border:1px solid var(--glass-border);background:transparent;cursor:pointer;padding:1px;border-radius:4px;vertical-align:middle;"> Color</label></div><div id="et-custom-row"><label style="font-size:0.8rem;color:var(--text-muted);display:block;margin-bottom:0.3rem;">Custom Tag Text:</label><input type="text" id="et-custom" value="' + customTagVal.replace(/"/g,'&quot;') + '" placeholder="e.g. Elite Hacker" style="width:100%;background:var(--input-bg);border:1px solid var(--glass-border);padding:0.5rem 0.7rem;color:var(--text);font-size:0.8rem;outline:none;border-radius:8px;"></div><div style="margin-top:1rem;font-size:0.85rem;color:var(--text-muted);">Preview: <span class="admin-tag-preview tag-' + style + '" id="et-preview" style="color:' + color + ';border-color:' + color + ';font-size:0.75rem;padding:2px 10px;">' + (displayTag || u.role.toUpperCase()) + '</span></div><div style="margin-top:1.5rem;"><button class="btn-neon" id="et-close" style="padding:0.4rem 1.2rem;font-size:0.75rem;">Done</button></div></div>';
            document.body.appendChild(overlay);

            overlay.querySelectorAll('.tag-style-btn').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    var s = this.getAttribute('data-s');
                    overlay.querySelectorAll('.tag-style-btn').forEach(function(b) { b.classList.remove('tag-style-active'); });
                    this.classList.add('tag-style-active');
                    var preview = document.getElementById('et-preview');
                    preview.className = 'admin-tag-preview tag-' + s;
                    var cr = document.getElementById('et-color-row');
                    if (s === 'rainbow') { cr.style.display = 'none'; preview.style.color = ROLE_COLORS[u.role] || '#8888aa'; preview.style.borderColor = ROLE_COLORS[u.role] || '#8888aa'; }
                    else { cr.style.display = ''; var c = document.getElementById('et-color').value; preview.style.color = c; preview.style.borderColor = c; }
                    saveUser(username, { tagStyle: s });
                    var customInput = document.getElementById('et-custom');
                    if (customInput) {
                        preview.textContent = customInput.value.trim() || (ROLE_LABEL[u.role] || u.role.toUpperCase());
                    }
                });
            });

            document.getElementById('et-color').addEventListener('input', function() {
                var preview = document.getElementById('et-preview');
                preview.style.color = this.value;
                preview.style.borderColor = this.value;
                saveUser(username, { tagColor: this.value });
            });

            document.getElementById('et-custom').addEventListener('input', function() {
                var preview = document.getElementById('et-preview');
                saveUser(username, { customTag: this.value });
                preview.textContent = this.value.trim() || (ROLE_LABEL[u.role] || u.role.toUpperCase());
            });

            document.getElementById('et-close').addEventListener('click', function() {
                document.body.removeChild(overlay);
                renderUsersSection();
                renderTagsSection();
            });
            overlay.addEventListener('click', function(e) { if (e.target === overlay) { document.body.removeChild(overlay); renderUsersSection(); renderTagsSection(); } });
        }

        function renderSystem() {
            function pad(n) { return n.toString().padStart(2,'0'); }
            var start = Date.now();
            var html = '<div class="dash-grid" style="max-width:900px;">';
            html += '<div class="dash-card"><div class="dash-header">CPU</div><div class="dash-stat" id="sys-cpu">0%</div><div class="dash-bar"><div class="dash-fill" id="sys-cpu-f" style="width:0%"></div></div></div>';
            html += '<div class="dash-card"><div class="dash-header">MEMORY</div><div class="dash-stat" id="sys-mem">0 MB</div><div class="dash-bar"><div class="dash-fill" id="sys-mem-f" style="width:0%"></div></div></div>';
            html += '<div class="dash-card"><div class="dash-header">UPTIME</div><div class="dash-stat" id="sys-up">00:00:00</div><div class="dash-bar"><div class="dash-fill" id="sys-up-f" style="width:0%"></div></div></div>';
            html += '<div class="dash-card"><div class="dash-header">NETWORK</div><div class="dash-stat" id="sys-net">0 Mbps</div><div class="dash-bar"><div class="dash-fill" id="sys-net-f" style="width:0%"></div></div></div>';
            html += '</div>';

            html += '<div class="dash-terminal" style="margin-top:2rem;">';
            html += '<div class="dash-term-header">SYSTEM TERMINAL <span class="term-blink">&#9608;</span></div>';
            html += '<div class="dash-term-body" id="sys-term-body" style="min-height:200px;max-height:300px;">';
            html += '<div class="term-line"><span class="term-prompt">system@cybersec:~$</span> monitoring active</div>';
            html += '</div></div>';

            document.getElementById('section-system').innerHTML = html;

            var terms = [
                'CPU temperature: nominal',
                'memory allocation: stable',
                'network interfaces: all up',
                'disk usage: 42%',
                'process count: 127',
                'no anomalies detected',
            ];
            var ti = 0;
            setInterval(function() {
                document.getElementById('sys-cpu').textContent = Math.floor(Math.random() * 85 + 10) + '%';
                document.getElementById('sys-cpu-f').style.width = Math.floor(Math.random() * 85 + 10) + '%';
                document.getElementById('sys-mem').textContent = Math.floor(Math.random() * 8000 + 256) + ' MB';
                document.getElementById('sys-mem-f').style.width = Math.floor(Math.random() * 85 + 10) + '%';
                document.getElementById('sys-net').textContent = Math.floor(Math.random() * 950 + 1) + ' Mbps';
                document.getElementById('sys-net-f').style.width = Math.floor(Math.random() * 95 + 5) + '%';
                var elapsed = Math.floor((Date.now() - start) / 1000);
                var h = Math.floor(elapsed / 3600), m = Math.floor((elapsed % 3600) / 60), s = elapsed % 60;
                document.getElementById('sys-up').textContent = pad(h) + ':' + pad(m) + ':' + pad(s);
                document.getElementById('sys-up-f').style.width = Math.min((elapsed / 3600) * 5, 95) + '%';
                var tb = document.getElementById('sys-term-body');
                if (tb && ti < terms.length) {
                    var line = document.createElement('div');
                    line.className = 'term-line';
                    line.innerHTML = '<span class="term-prompt">system@cybersec:~$</span> ' + terms[ti];
                    tb.appendChild(line);
                    tb.scrollTop = tb.scrollHeight;
                    ti++;
                }
            }, 2500);
        }

        // Init
        loadUsers().then(function() {
            return loadTickets();
        }).then(function() {
            if (!canAccess()) {
                document.getElementById('dash-content').style.display = 'none';
                document.getElementById('dash-denied').style.display = '';
            } else {
                renderTabs();
                initSections();
                renderOverview();
            }
        });
    </script>
    <script>
        var _tok = localStorage.getItem('cybersec-token');
        if (_tok) {
            document.querySelectorAll('.nav-links a[href="login.html"]').forEach(function(el) { el.remove(); });
            apiGetUsers().then(function(users) {
                var u = users.find(function(x) { return x.username === localStorage.getItem('cybersec-session'); });
                var r = u ? u.role : 'regular';
                if (['owner','co-owner','dev','admin'].indexOf(r) === -1) {
                    document.querySelectorAll('.nav-links a[href="tickets.html"]').forEach(function(el) { el.remove(); });
                }
            });
        }
    </script>
</body>
</html>
